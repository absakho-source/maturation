# Virtual host PLASMAP - maturation.economie.gouv.sn
# À placer dans /etc/nginx/sites-available/plasmap
# Puis : sudo ln -s /etc/nginx/sites-available/plasmap /etc/nginx/sites-enabled/

# Redirection HTTP → HTTPS
server {
    listen 80;
    server_name maturation.economie.gouv.sn;
    return 301 https://$host$request_uri;
}

# HTTPS
server {
    listen 443 ssl;
    server_name maturation.economie.gouv.sn;

    # Certificat SSL (à adapter selon le certificat fourni)
    # Option A : Let's Encrypt (si internet disponible)
    # ssl_certificate     /etc/letsencrypt/live/maturation.economie.gouv.sn/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/maturation.economie.gouv.sn/privkey.pem;

    # Option B : Certificat auto-signé (temporaire, pour test)
    ssl_certificate     /etc/ssl/certs/plasmap-selfsigned.crt;
    ssl_certificate_key /etc/ssl/private/plasmap-selfsigned.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Taille max des fichiers uploadés
    client_max_body_size 100M;

    # Logs séparés de e-Présence
    access_log /var/log/nginx/plasmap_access.log;
    error_log  /var/log/nginx/plasmap_error.log;

    # Frontend Vue.js (fichiers statiques buildés)
    location / {
        root /var/www/plasmap/frontend/dist;
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # Backend Flask (API)
    location /api {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Fichiers uploadés
    location /uploads {
        alias /var/www/plasmap/backend/uploads;
    }
}
